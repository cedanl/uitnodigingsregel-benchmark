[project]
name = "uitnodigingsregel-benchmark"
version = "0.1.0"
description = "Benchmarking harness for the uitnodigingsregel methodology"
readme = "README.md"
requires-python = ">=3.13"
authors = [
    {name = "Steven Ramondt"},
]
dependencies = [
    "matplotlib>=3.8.0",
    "numpy>=2.2.2",
    "pandas>=2.2.3",
    "pyyaml>=6.0.2",
    "scikit-learn>=1.6.1",
    "streamlit>=1.50",
    "student_signal>=0.2.0",
    "xgboost>=3.2.0",
]

[project.scripts]
uitnodigingsregel-benchmark = "uitnodigingsregel_benchmark.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/uitnodigingsregel_benchmark"]

[tool.uv]
cache-dir = "./.uv_cache"

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP"]
ignore = ["N803", "N806"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[dependency-groups]
dev = [
    "pytest>=9.0.2",
    "ruff>=0.15.6",
]
